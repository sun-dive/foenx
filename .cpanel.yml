---
# foen - © 2026 sun-dive.
# cPanel Git™ Version Control deployment. "Update from Remote", THEN "Deploy HEAD Commit". Push ≠ live.
#
# ⚠⚠ foen.xyz is an ADDON domain on the grafcars.com account. Its docroot is what cPanel → Domains shows
#    for foen.xyz, and NOTHING here may write anywhere else. On 12 Sept a deploy aimed at public_html
#    overwrote grafcars.com's docroot. ⇒ The guard below refuses to run unless the docroot already
#    exists, so a wrong path fails loudly instead of landing on another site.
# ⚠ A NEW FILE IS INVISIBLE UNTIL IT IS LISTED HERE.
deployment:
  tasks:
    # The docroot is READ from cPanel, never guessed: uapi reports it for the domain, php parses the JSON.
    - export UAPI="$(command -v uapi || echo /usr/local/cpanel/bin/uapi)"
    - export DEPLOYPATH="$("$UAPI" --output=json DomainInfo single_domain_data domain=foen.xyz | php -r 'echo (string)(json_decode(stream_get_contents(STDIN))->result->data->documentroot ?? "");')"
    - echo "foen: cPanel says foen.xyz's docroot is '$DEPLOYPATH'"
    - test -n "$DEPLOYPATH" && test -d "$DEPLOYPATH" || { echo "foen: no usable docroot for foen.xyz - nothing written"; exit 1; }
    - case "$DEPLOYPATH" in "$HOME/public_html"|"$HOME/public_html/") echo "foen: refusing to deploy into public_html (grafcars.com)"; exit 1;; esac
    # ── one-time repair of grafcars.com's docroot: remove ONLY what the 12 Sept deploy put there ──
    # Evidence it was ours: public_html/version.txt holds a foen commit. Delete this block after it has run once.
    - if [ -f "$HOME/public_html/version.txt" ] && grep -qE '^(bd40ed4|6dcf2f9)$' "$HOME/public_html/version.txt"; then /bin/rm -f "$HOME/public_html/index.html" "$HOME/public_html/.htaccess" "$HOME/public_html/relay.php" "$HOME/public_html/version.txt"; /bin/rm -rf "$HOME/public_html/js"; echo "foen: removed the 12 Sept files from public_html"; fi
    # ── the site ──
    - /bin/mkdir -p "$DEPLOYPATH/js/engine" "$DEPLOYPATH/js/vendor/noble-hashes"
    - /bin/cp site/index.html "$DEPLOYPATH/index.html"
    - /bin/cp site/.htaccess "$DEPLOYPATH/.htaccess"
    - /bin/cp site/js/foen.mjs "$DEPLOYPATH/js/foen.mjs"
    - /bin/cp site/js/engine/*.mjs site/js/engine/README "$DEPLOYPATH/js/engine/"
    - /bin/cp site/js/vendor/noble-hashes/*.js site/js/vendor/noble-hashes/LICENSE site/js/vendor/noble-hashes/README "$DEPLOYPATH/js/vendor/noble-hashes/"
    # The relay keeps call tips OUTSIDE every docroot.
    - /bin/mkdir -p "$HOME/foen-data" && /bin/chmod 700 "$HOME/foen-data"
    - /bin/cp server/relay.php "$DEPLOYPATH/relay.php"
    - git rev-parse --short HEAD > "$DEPLOYPATH/version.txt"   # what is live: https://foen.xyz/version.txt
    - echo "foen ← $(git rev-parse --short HEAD)"
